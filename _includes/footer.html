{%- assign lang = page.lang | default: site.default_lang -%}
{%- assign strings_key = 'strings_' | append: lang -%}
{%- assign strings = site.data[strings_key] -%}

<footer class="site-footer">
  <div class="footer-copyright">
    © <span data-year data-lang="{{ lang }}"></span> {{ strings.site_title }} • {{ strings.footer.tagline }}
  </div>
  <nav class="footer-links">
    <a href="{{ site.social.whatsapp }}" target="_blank" rel="noopener">
      {{ strings.footer.links.whatsapp }}
    </a>
    <span class="separator">•</span>
    <a href="{{ site.social.github }}" target="_blank" rel="noopener">
      {{ strings.footer.links.github }}
    </a>
  </nav>
</footer>
