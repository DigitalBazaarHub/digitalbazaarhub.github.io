{%- assign lang = page.lang | default: site.default_lang -%}
{%- assign strings_key = 'strings_' | append: lang -%}
{%- assign strings = site.data[strings_key] -%}

<div class="lang-dropdown">
  <button class="lang-trigger" type="button">
    <span class="lang-globe">🌐</span>
    <span>{{ strings.language.current }}</span>
    <span class="lang-arrow">▾</span>
  </button>
  <div class="lang-menu">
    {%- if lang == 'ar' -%}
    <a href="/ar/" class="lang-item is-active">
      العربية
      <span class="lang-check">✓</span>
    </a>
    <a href="/en/" class="lang-item">
      English
    </a>
    {%- else -%}
    <a href="/en/" class="lang-item is-active">
      English
      <span class="lang-check">✓</span>
    </a>
    <a href="/ar/" class="lang-item">
      العربية
    </a>
    {%- endif -%}
  </div>
</div>
