# Recaps list — add new recaps at the top
# Each recap has:
#   - title (bilingual)
#   - date: YYYY-MM-DD format
#   - event_type: fireside | panel | qa | workshop | bazaar_saturday | other
#   - host (bilingual) - who hosted/led the session
#   - description (bilingual) - brief summary
#   - url (optional) - relative URL to a detailed recap page/article
items:
  - title:
      en: "Building in Public: Lessons from Arab Founders"
      ar: "البناء علنًا: دروس من مؤسسين عرب"
    date: "2025-01-18"
    event_type: fireside
    host:
      en: "Ahmad & Sara"
      ar: "أحمد وسارة"
    description:
      en: "Three founders shared their journey of building startups transparently, including failures and pivots. Key takeaway: vulnerability builds trust."
      ar: "شارك ثلاثة مؤسسين رحلتهم في بناء شركاتهم الناشئة بشفافية، بما في ذلك الإخفاقات والتحولات. الدرس الرئيسي: الانفتاح يبني الثقة."
    url:
      en: /articles/en-building-in-public-recap/
      ar: null

