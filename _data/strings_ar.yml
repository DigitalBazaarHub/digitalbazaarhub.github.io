# About Section (What happens in the Bazaar?)
about:
  kicker: "ماذا يحدث في البازار؟"
  title: "محادثات وكتابة وتجريب تحت سقف واحد."
  subtitle: "البازار الرقمي ليس مجرد دردشة أو مدونة أو منظمة GitHub. إنه الثلاثة معاً – مترابطون بنفس الأشخاص والقصص."
  features:
    - label: "النقاشات"
      title: "المحادثات والمسارات"
      description: "مجموعات واتساب متخصصة لأنواع مختلفة من الحديث: الدردشة العامة، المغتربين الأردنيين، الشركات الناشئة والمؤسسين، البرمجيات والهندسة، المنتجات والنمو، الإدارة والقيادة، النصائح والإرشاد، الوظائف والمزيد. فكر فيها كسوق من المحادثات المتداخلة والمستمرة."
    - label: "الكتابة"
      title: "المقالات والملاحظات الميدانية"
      description: "مقالات وتأملات وملاحظات من أشخاص في البازار – حول الهندسة والمنتجات والقيادة والأسواق والمهن والحياة. أقل من \"تسويق المحتوى\"، وأكثر من \"هذا ما حدث فعلاً وما تعلمناه\"."
    - label: "التجريب"
      title: "المصدر المفتوح والأدوات"
      description: "منظمة GitHub للأدوات الصغيرة والبوتات والتجارب التي تنبت من احتياجات المجتمع. بنية تحتية مشتركة، تعلم مشترك، ومشاريع بضغط منخفض يمكن لأي شخص الانضمام إليها عندما يضربه الفضول."

