  title: "سوق عامل، وليس قناة بث."
  subtitle: "في معظم الأيام، يبدو البازار كمزيج من التبادلات الصغيرة المحددة والمواضيع الأبطأ والأعمق. تغوص حيث يكون الأمر ذا صلة، تضيف شيئاً مفيداً، ثم تتراجع."
  items:
    - title: "أسئلة قصيرة، إجابات حقيقية."
      description: "اطرح أسئلة محددة من سياقك: قرار منتج، عقدة إدارية، مقايضة بنية تحتية، خطوة مهنية."
    - title: "قصص وليس آراء ساخنة."
      description: "نفضل \"هذا ما جربناه وكيف سار الأمر\" أكثر من الآراء الساخنة أو مواضيع النصائح العامة."
    - title: "مواضيع بطيئة الاحتراق."
      description: "بعض النقاشات تتحول إلى مقالات أو أدوات. عندما يستمر شيء ما في الظهور، نكتبه أو نصنع نموذجاً أولياً له."
  tips_title: "قواعد إبهامية خفيفة"
  tips:
    - "تصفح، لا تحاول قراءة كل شيء. البازار يعمل دائماً."
    - "رد حيث يمكنك المساعدة حقاً، وليس في كل مكان لديك رأي."
    - "لا بأس بالتخفي لفترة – فقط قدم نفسك عندما تكون جاهزاً."

