    - "ردّ حيث تستطيع أن تساعد فعلاً، لا حيث لديك رأي فقط."
    - "لا بأس أن تتابع بصمت فترة — لكن قدّم نفسك عندما تصبح جاهزاً."

# Rules Summary Section (for home page)
rules_summary:
  kicker: "معايير البازار"
  title: "كيف نحافظ على صحة البازار"
  subtitle: "الدفء لا يعني الفوضى. نحمي الانتباه والأمان والثقة — ليبقى المكان مفيداً."
  short_title: "باختصار"
  items:
    - title: "لا سبام. لا ترويج مبطّن. لا نشرٍ متكرر بين المسارات."
      description: "أي رابط يحتاج سياقاً (لمن هو + لماذا يهم + ماذا تريد). انشر مرة واحدة في المسار الصحيح — ولا ترشّ المحتوى في كل مكان."
    - title: "لا لقُمع «راسلني خاص»."
      description: "لا تصطد عملاء/فرص/مرشحين عبر دفع الناس للخاص. الافتراضي هو الرد علناً. الخاص فقط بموافقة أو بطلب."
    - title: "ابقَ قريباً من العمل."
      description: "تقنية، منتجات، أعمال، مسارات مهنية، والبيئة الرقمية. لا نقاشات سياسية/دينية/طائفية تتحول لحرائق."
    - title: "اسأل جيداً. ورد الجميل."
      description: "السؤال الجيد يتضمن سياقاً + قيوداً + ماذا جرّبت. وإذا استفدت، ارجع وشارك النتيجة."
    - title: "احترام الناس والخصوصية والأمان."
      description: "لا تحرش، لا كراهية، لا تشهير/دَوْكسنغ، لا احتيال أو انتحال. واتساب يُظهر رقم هاتفك لأعضاء المجموعات."
  moderation_title: "الإشراف والأمان"
  moderation_text: "غالباً نُصعّد هكذا: تنبيه → كتم/مهلة → إزالة → حظر. الحالات الشديدة (تحرش/احتيال) تتجاوز المراحل."

