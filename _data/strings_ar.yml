cadence_page:
  title: "الإيقاع"
  subtitle: "يبقى البازار دافئًا وعالي الجودة لأن بعض الأمور تتكرر بانتظام. الحضور المستمر يراكم الثقة والفرص."
  keep_up:
    label: "كيف تتابع؟"
    text: "نعلن المواعيد والتذكيرات في مجموعة «الإعلانات». قد تختلف الأوقات — ونحاول المداورة بين المناطق الزمنية."

  rhythms:
    heading: "📅 جلسات متكرّرة"
    items:
      - title: "سبت البازار"
        description: "جلسة كتابية خفيفة يوم السبت عبر المجموعات: شارك ما تبنيه/تتعلمه، اطرح أسئلة، وشارك في النقاش."
        how: "أفضل طريقة للمشاركة: تحديث قصير (سطران–ثلاثة) + سؤال واحد واضح."
      - title: "جلسات Firesides الشهرية"
        description: "جلسة يقودها ضيف (أو حلقة نقاش) حول موضوع واحد مع أسئلة وأجوبة مباشرة. نعلن الشكل والموعد مسبقًا."
        how: "أفضل طريقة للمشاركة: اقرأ تمهيد الجلسة، جهّز سؤالًا واحدًا جيدًا، ثم تابع بعد الجلسة."
      - title: "خيوط الأسئلة والأجوبة الدورية"
        description: "خيوط «اسألني أي شيء» غير متزامنة مع خبراء من المجتمع. ممتازة للأسئلة العميقة دون الالتزام بموعد."
        how: "أفضل طريقة للمشاركة: سياق + قيود + ماذا جرّبت."

  participation:
    heading: "✅ كيف تشارك دون أن تُرهق"
    do:
      heading: "افعل هذا"
      items:
        - "ابدأ بمسارين فقط، وابقَ غير مكتوم لمدة أسبوع، ثم زد تدريجيًا."
        - "اطرح الأسئلة بسياق، ثم عُد بنتيجة ما حدث."
        - "رُدّ حيث يمكنك مساعدة حقيقية — لا في كل مكان لديك رأي."
    dont:
      heading: "تجنّب هذا"
      items:
        - "إعادة نشر نفس الرسالة في كل المجموعات."
        - "روابط سريعة بلا سياق."
        - "سلوك «راسلني على الخاص» أو رسائل باردة دون تمهيد."

  host:
    heading: "🎙️ هل تريد استضافة Fireside أو تشغيل Q&A؟"
    text: "نرحّب بالجلسات التي يقودها أعضاء المجتمع — بشرط أن تكون عملية ومركّزة ومفيدة."
    template_label: "انسخ/الصق هذا المقترح:"
    template: |
      الموضوع: [موضوع واحد واضح]
      الشكل: [Fireside / حلقة نقاش / خيط Q&A]
      لمن؟: [أدوار / مستوى]
      ماذا سيخرج الناس به؟: [3 نقاط]
      ضيوف مقترحون (اختياري): [أسماء + لماذا]
      شهر/منطقة زمنية مفضلة: [اختياري]
    note: "أرسل هذا للمشرفين (أو انشره في المكان الذي تجمعون فيه مقترحات الجلسات)."

  faq:
    heading: "❓ إجابات سريعة"
    items:
      - question: "هل الجلسات بالعربية فقط؟"
        answer: "لا. بعضها عربي، بعضها إنجليزي، وكثير منها خليط. الاثنين مرحّب بهما."
      - question: "هل تنشرون ملخصات؟"
        answer: "أحيانًا. وعندها نضع الرابط في المجموعة ذات الصلة (ولاحقًا على الموقع)."
      - question: "كيف أعرف ما القادم؟"
        answer: "مجموعة «الإعلانات» — هي مصدر الحقيقة."

