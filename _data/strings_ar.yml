# Rules Page
rules_page:
  kicker: "قواعد المجتمع"
  title: "كيف نحافظ على صحة البازار"
  dek: "هذه الإرشادات موجودة حتى يبقى البازار الرقمي مفيداً ودافئاً وآمناً – وليس للإفراط في مراقبة المحادثات. إذا كنت في شك، اتجه نحو الكرم والوضوح والاحترام."
  meta_note: "هذه وثيقة حية. قد نحسنها مع نمو المجتمع وظهور مواقف جديدة."
  short_version: "كن لطيفاً. شارك بسخاء. حافظ على البناءية والصلة. لا تزعج أو تتحرش بالناس. للمشرفين الحق في إزالة أي شخص يجعل البازار أسوأ باستمرار."
  rules:
    - number: "٠١"
      title: "كن لطيفاً ومحترماً"
      body: |
        عامل الجميع في البازار بلياقة إنسانية أساسية. نأتي من بلدان وخلفيات وتخصصات مختلفة – افترض النية الحسنة، اطرح الأسئلة، وتجنب الهجمات الشخصية.
        
        نحن هنا لدعم ورفع بعضنا البعض في مسيرتنا المهنية، وليس لتسجيل النقاط.
    - number: "٠٢"
      title: "شارك المعرفة والفرص بحرية"
      body: |
        البازار يعمل فقط إذا جلب الناس قصصاً ودروساً وفرصاً حقيقية. شارك ما تعرفه: أشياء جربتها، مطبات وقعت فيها، موارد وجدتها مفيدة، أدوار تبحث عن موظفين لها.
        
        لا تحتاج أن تكون "خبيراً" للمساهمة – الملاحظات الميدانية الصادقة غالباً أكثر قيمة من النظرية المصقولة.
    - number: "٠٣"
      title: "حافظ على النقاشات البناءة وذات الصلة"
      body: |
        ابق ضمن عالم التقنية والمنتجات والأعمال والبحث والنظام الرقمي بشكل عام. المهام الجانبية لا بأس بها، لكن المسارات الرئيسية للمحادثات المفيدة والمتعلقة بالعمل.
        
        الاختلاف مرحب به؛ جر الناس أو بدء حروب شعلة ليس كذلك. انتقد الأفكار والأنظمة، وليس الأشخاص أو المجموعات.
    - number: "٠٤"
      title: "لا spam، لا بيع مباشر"
      body: |
        شارك عملك بشكل طبيعي – كجزء من نقاش أو قصة أو "إليك شيء قد يساعد" حقيقي. لا تنشر نفس الرابط في كل مكان أو تحول البازار إلى قمع مبيعات.
        
        إذا لم تكن متأكداً مما إذا كان شيء مناسباً، أضف سياقاً: لماذا تشاركه، لمن هو، وما نوع الملاحظات أو الرد الذي تبحث عنه.
    - number: "٠٥"
      title: "آداب الوظائف والتوظيف"
      body: |
        منشورات الوظائف وفرص العقود تنتمي إلى مسار / قناة الوظائف المخصصة، وليس منتشرة في كل مجموعة.
      list:
        - "اجعل المنشورات واضحة: الدور، الشركة، الموقع/عن بعد، النوع (دوام كامل، جزئي، عقد)، وكيفية التقديم."
        - "لا تقم بوسم أو مراسلة أشخاص عشوائياً بعروض لم يطلبوها."
        - "إذا كنت تبحث عن عمل، رسالة واحدة مكتوبة جيداً أفضل من التذكيرات اليومية."
    - number: "٠٦"
      title: "احترافي لكن دافئ"
      body: |
        النبرة متعمدة غير رسمية – مثل طاولة مقهى جيدة في مؤتمر – لكن هذا لا يزال مساحة مهنية.
        
        النكات مرحب بها؛ الضرب للأسفل ليس كذلك. شارك الانتصارات والخسائر، لكن احترم الخصوصية وتجنب مشاركة المعلومات الحساسة التي ليست ملكك لمشاركتها.
    - number: "٠٧"
      title: "تقدير المشرفين"
      body: |
        للمشرفين الحق في إزالة الرسائل أو الأعضاء الذين يجعلون المساحة أسوأ بوضوح – spam، تحرش، جدال سيء النية المستمر، أو تجاهل الملاحظات المتكررة.
        
        عندما يكون ممكناً، سننبه ونشرح أولاً. في الحالات الأكثر خطورة، قد نزيل الأشخاص دون تحذير لحماية بقية المجتمع.
    - number: "٠٨"
      title: "لا تكن نذلاً"
      body: |
        لا تسامح مع العنصرية أو التمييز الجنسي أو الكراهية أو التحرش الشخصي أو التشهير أو أي نوع من الإساءة المستهدفة.
        
        إذا لم تكن متأكداً مما إذا كان شيء يتجاوز الحد، لا تنشره. إذا أشار إليك شخص ما بشيء، استمع بدلاً من المضاعفة.
  cta_title: "ترى شيئاً خاطئاً؟"
  cta_text: "إذا جعلتك رسالة أو تفاعل غير مرتاح، تواصل مع مشرف بشكل خاص. نفضل سماع ذلك مبكراً على تركه يتفاقم."
  cta_closing: "إذا كان كل هذا يبدو جيداً لك، فستستمتع على الأرجح بالبازار."

