        description: "كود، معمارية، أدوات، تصحيح أخطاء، نقاشات تقنية عميقة"
      - name: "المنتج والتصميم والنمو"
        description: "تجربة مستخدم، مؤشرات، تجارب، طرح للسوق، نقد/مراجعات تصميم"
      - name: "سوق الوظائف"
        description: "توظيف، إعلانات وظائف، عقود وفريلانس، تحركات مهنية"
      - name: "النصيحة والإرشاد"
        description: "أسئلة مهنية، طلبات ملاحظات، مواضيع \"كيف سويت…\""
      - name: "الإدارة والقيادة"
        description: "قيادة فرق، تصميم المنظمات، مشاكل الناس، مسارات نمو"
      - name: "الشركات الناشئة والمؤسسون"
        description: "تمويل، MVP، محاورات/تحولات، تعارف شركاء مؤسسين"
      - name: "الأردنيون المغتربون"
        description: "للأردنيين في الخارج—سياق محلي وروابط الجالية"

  # Quality guidance
  quality:
    ask_well:
      heading: "🎯 اسأل بشكل جيّد"
      items:
        - "**السياق** — ما الوضع؟"
        - "**ما الذي جرّبته** — ورّينا محاولاتك"
        - "**القيود** — وقت، ميزانية، عوائق"
        - "**ماذا تريد** — رأي؟ خيارات؟ تعريف/Intro؟"
    give_back:
      heading: "🤝 ردّ الجميل"
      items:
        - "ارجع وشارك ماذا حدث بعد ذلك"
        - "خلّ طلباتك عامة قدر الإمكان"
        - "لا تكرر نفس الشيء في كل المجموعات"
        - "ساعد غيرك عندما تقدر"

  # Cadence
  cadence:
    heading: "📅 جلسات متكررة"
    items:
      - title: "بازار السبت"
        description: "جلسة يوم السبت الكتابية، بشكل خفيف وعبر المجموعات، شارك ما تبنيه/تتعلمه، اطرح أسئلة، وشارك في النقاش."
      - title: "جلسات فايرسايد الشهرية"
        description: "ضيف أو أكثر، موضوع واحد، وأسئلة وأجوبة مباشرة. يُعلن عنها مسبقًا."
      - title: "خيوط أسئلة وأجوبة دورية"
        description: "أسئلة وأجوبة غير متزامنة (Async) من خبراء في المجتمع."
    next_up: "الجلسة القادمة: يُعلن عنها في مجموعة الإعلانات."

  # Rules summary
  rules_summary:
    heading: "📜 القواعد في ٢٠ ثانية"
    items:
      - "لا سبام، لا ترويج مبطّن، ولا تكرار نشر نفس الشيء"
      - "لا سلوك \"راسلني خاص\" كسوق للصفقات"
      - "التزم بمواضيع العمل (لا حروب سياسية/طائفية)"
      - "احترام الخصوصية والسلامة"
      - "للمشرفين حق إزالة من يُسيء للمساحة"
    button: "اقرأ القواعد كاملة"

  # Privacy notice
  privacy:
    label: "ملاحظة خصوصية:"
    text: "واتساب يُظهر رقم هاتفك لأعضاء المجموعات التي تشاركهم فيها. إذا لم تكن مرتاحًا لهذا، لا تنضم لمجموعات أنت غير متأكد منها."

  # FAQ
  faq:
    heading: "❓ إجابات سريعة"
    items:
      - question: "هل المجتمع بالعربية فقط؟"
        answer: "لا. أغلب النقاش يكون بالعربية أو بالإنجليزية حسب المتحدثين. كلاهما مرحّب به. كثير من الخيوط تكون ثنائية اللغة."
      - question: "هل أقدر أروّج لمنتجي؟"
        answer: "نعم—إذا أضفت سياقًا (لمن هو؟ ما المشكلة التي يحلّها؟ وما نوع الملاحظات التي تريدها). لا روابط سريعة بدون شرح."
      - question: "هل أقدر أرسل رسائل خاصة للناس؟"
        answer: "فقط إذا كان الشخص دعا لذلك أو لديك سياق حقيقي. الإزعاج/التواصل البارد يعطي انطباعًا سيئًا. ابدأ في النقاشات العامة أولاً."
      - question: "من هم المشرفون؟"
        answer: "مجموعة صغيرة من أعضاء المجتمع النشطين. غالبًا نبدأ بتنبيه لطيف ثم نُصعّد عند الحاجة. الحالات الشديدة (تحرش، سبام) قد تتجاوز الخطوات."
      - question: "ماذا لو أخطأت؟"
        answer: "غالبًا ستأخذ تنبيهًا لطيفًا. لسنا هنا لطرد الناس—فقط للحفاظ على جودة النقاش. تعلّم وكمل."

