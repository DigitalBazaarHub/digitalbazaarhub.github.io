  image_alt: "Humans and friendly robots talking and working together in a Middle Eastern bazaar."

# About Section (What happens in the Bazaar?)
about:
  kicker: "What happens in the Bazaar?"
  title: "Conversations, writing and tinkering under one tent."
  subtitle: "Digital Bazaar isn't just a chat, a blog, or a GitHub org. It's all three at once – tied together by the same people and stories."
  features:
    - label: "Discussions"
      title: "Conversations & lanes"
      description: "Focused WhatsApp groups for different kinds of talk: General Chat, Jordanian Expats, Startups & Founders, Software & Engineering, Product & Growth, Management & Leadership, Advice & Mentorship, Jobs and more. Think of it as a souq of ongoing, overlapping conversations."
    - label: "Writing"
      title: "Articles & field notes"
      description: "Essays, reflections and notes from people in the Bazaar – on engineering, product, leadership, markets, careers and life. Less \"content marketing\", more \"here's what actually happened and what we learned\"."
    - label: "Tinkering"
      title: "Open source & tools"
      description: "A GitHub organisation for small tools, bots and experiments that grow out of community needs. Shared infra, shared learning, and low-pressure projects anyone can join when curiosity hits."

# Rhythm Section (How we use the space)
rhythm:
  kicker: "How we use the space"
  title: "A working bazaar, not a broadcast channel."
  subtitle: "Most days, the Bazaar looks like a mix of small, specific exchanges and slower, deeper threads. You dip in where it's relevant, add something useful, then step back out."
  items:
    - title: "Short questions, real answers."
      description: "Ask concrete questions from your context: a product decision, a management knot, an infra tradeoff, a career move."
    - title: "Stories over takes."
      description: "We prefer \"here's what we tried and how it went\" more than hot takes or generic advice threads."
    - title: "Slow-burning threads."
      description: "Some discussions turn into articles or tools. When something keeps coming up, we write it down or prototype it."
  tips_title: "Light rules of thumb"
  tips:
    - "Skim, don't try to read everything. The bazaar is always on."
    - "Reply where you can genuinely help, not everywhere you have an opinion."
    - "It's fine to lurk for a while – just introduce yourself when you're ready."

