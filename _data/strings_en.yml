# Hero Section
hero:
  kicker: "warm, focused, and curated"
  headline: "A high-signal Arabic community for builders."
  description: "Digital Bazaar is a WhatsApp-first community for Arab builders who ship: founders, engineers, product leaders, designers, marketers, researchers, and teams.\n\nStart here on the website to learn how we work, join the right lanes, and show up for recurring sessions like <i>Bazaar Saturdays</i> and the monthly <i>Firesides</i>."
  image_alt: "Humans and friendly robots talking and working together in a Middle Eastern bazaar."

# About Section (What happens in the Bazaar?)
about:
  kicker: "What happens in the Bazaar?"
  title: "A living network — powered by recurring conversations."
  subtitle: "Digital Bazaar is WhatsApp-first, but it’s not “just chat.” We use lanes, light structure, and recurring sessions to turn strangers into warm ties — and warm ties into real outcomes."
  features:
    - label: "Discussions"
      title: "Lanes with real conversations"
      description: "Topic-based WhatsApp groups where people swap practical experience: engineering, product, design & growth, leadership, jobs, startups, expats, and more. Think of it as a souq of overlapping lanes — you join what matters and ignore the rest."
    - label: "Cadence"
      title: "Rituals and sessions that bring people back"
      description: "We don't rely on hope-based interaction. We run recurring rhythms like Bazaar Saturdays, plus monthly firesides/panels and periodic Q&A threads — so the network compounds over time instead of fading."
    - label: "Projects & Mentorship"
      title: "From talk → warm intros → shipped work"
      description: "When trust forms, things happen: feedback loops, mentorship, collaborations, and community-born projects like Meshkah. Mentorship is structured (time-boxed office hours / clear asks), and projects are opt-in — no vague promises, just proof-of-work."

# Rhythm Section (How we use the space)
rhythm:
  kicker: "How we use the space"
  title: "A working bazaar, not a broadcast channel."
  subtitle: "Most days, the Bazaar looks like a mix of small, specific exchanges and slower, deeper threads. You dip in where it's relevant, add something useful, then step back out."
  items:
    - title: "Short questions, real answers."
      description: "Ask concrete questions from your context: a product decision, a management knot, an infra tradeoff, a career move."
    - title: "Stories over takes."
      description: "We prefer \"here's what we tried and how it went\" more than hot takes or generic advice threads."
    - title: "Slow-burning threads."
      description: "Some discussions turn into articles or tools. When something keeps coming up, we write it down or prototype it."
  tips_title: "Light rules of thumb"
  tips:
    - "Skim, don't try to read everything. The bazaar is always on."
    - "Reply where you can genuinely help, not everywhere you have an opinion."
    - "It's fine to lurk for a while – just introduce yourself when you're ready."

# Rules Summary Section (for home page)
rules_summary:
  kicker: "Bazaar standards"
  title: "How we keep the bazaar healthy"
  subtitle: "Warm doesn’t mean messy. We protect attention, safety, and trust — so the space stays useful."
  short_title: "In short"
  items:
    - title: "No spam. No stealth promotion. No cross-posting."
      description: "Links need context (who it’s for + why it matters + what you want). Post once, in the correct lane — don’t spray."
    - title: "No “DM me” funnels."
      description: "Don’t fish for leads, clients, or candidates. Default to public replies. DM only by consent or when someone asks."
    - title: "Stay work-adjacent."
      description: "Tech, product, business, careers, and the digital ecosystem. No politics/religion/sectarian flamewars."
    - title: "Ask well. Give back."
      description: "Good questions include context + constraints + what you tried. If you got help, follow up with outcomes."
    - title: "Respect people, privacy, and safety."
      description: "No harassment, hate, doxxing, scams, or impersonation. WhatsApp shows your phone number to members."
  moderation_title: "Moderation & safety"
  moderation_text: "We usually escalate: nudge → timeout/mute → removal → ban. Severe cases (harassment/scams) skip steps."

