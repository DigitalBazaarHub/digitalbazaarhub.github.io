# Community Rules Section
rules:
  title: "🤝 Community Rules"
  items:
    - title: "Be kind and respectful"
      description: "Be kind and respectful to all members. We're here to support and uplift each other in our professional journeys."
    - title: "Share knowledge freely"
      description: "Share knowledge and opportunities freely. The bazaar thrives on open exchange of ideas and connections."
    - title: "Keep discussions constructive"
      description: "Keep discussions constructive and relevant to tech, business, and the digital ecosystem."
    - title: "No spam, no hard selling"
      description: "No spam, no hard selling. Share your work naturally and respect the community's attention."
    - title: "Professional yet warm"
      description: "Maintain professionalism while keeping the warm, informal spirit that makes our community special."
    - title: "Moderators' discretion"
      description: "Moderators reserve the right to remove disruptive members at any time, no warnings required."
    - title: "Don't be an asshole"
      description: "Zero tolerance for racism, sexism, harassment, or toxic behavior of any kind."

