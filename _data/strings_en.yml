  kicker: "Community rules"
  title: "How we keep the bazaar healthy."
  subtitle: "The full rules live on their own page, but the spirit is simple: be decent, bring value, don't abuse the space."
  short_title: "In short"
  items:
    - title: "Be kind and respectful."
      description: "We're here to support and uplift each other in our professional journeys."
    - title: "Share knowledge freely."
      description: "The bazaar thrives on open exchange of ideas, stories and opportunities."
    - title: "Keep it constructive."
      description: "Stay relevant to tech, business and the wider digital ecosystem – no drama for drama's sake."
    - title: "No spam, no hard selling."
      description: "Share your work naturally and respect everyone's attention."
    - title: "Don't be an asshole."
      description: "Zero tolerance for racism, sexism, harassment or toxic behavior of any kind."
  moderation_title: "Moderation & safety"
  moderation_text: "Moderators reserve the right to remove disruptive members at any time, with or without warning. The goal is not control – it's keeping the bazaar usable for everyone."

